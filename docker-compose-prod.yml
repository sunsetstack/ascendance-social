x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
name: ascendance-social
services:
  # --- CACHE ---
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    logging: *default-logging
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    networks:
      - app-network

    healthcheck:
      test: ["CMD", "sh", "-c", 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      retries: 5

  # --- APP LAYER ---
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/sunsetstack/ascendance-backend:${IMAGE_TAG:-latest}}
    container_name: backend
    restart: always
    logging: *default-logging
    environment:
      <<: &backend-environment
        ENABLE_WORKERS: "false"
        NODE_ENV: production
        TRUST_PROXY: ${TRUST_PROXY:-1}
        GIT_SHA: ${GIT_SHA:-unknown}
        MONGODB_URI: ${MONGODB_URI}
        REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
        JWT_SECRET: ${JWT_SECRET}
        ALLOWED_ORIGINS: https://${DOMAIN_NAME},https://www.${DOMAIN_NAME}
        COOKIE_SECURE: "true"
        CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
        CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
        CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
        RESEND_API_KEY: ${RESEND_API_KEY}
        FRONTEND_URL: https://${DOMAIN_NAME}
        REQUEST_LOG_PERSISTENCE_ENABLED: "true"
        SECURITY_AUDIT_MONGO_TTL_DAYS: ${SECURITY_AUDIT_MONGO_TTL_DAYS:-90}
        AUDIT_LOG_DIR: /app/audit/logs
        AUDIT_ARCHIVE_DIR: /app/audit/archives
        AUDIT_ARCHIVE_DELETE_SOURCE: ${AUDIT_ARCHIVE_DELETE_SOURCE:-true}
      SERVICE_NAME: backend
      FORENSIC_ARCHIVE_DIR: /app/forensic/archives

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - app-network

    volumes:
      - ./backend/audit/logs:/app/audit/logs
      - ./backend/audit/archives:/app/audit/archives
      - ./backend/forensic/archives:/app/forensic/archives

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 30s
      retries: 5

  frontend:
    image: ghcr.io/sunsetstack/ascendance-frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    restart: always
    logging: *default-logging

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - app-network

  # --- INFRA LAYER ---
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    logging: *default-logging

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - app-network

    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      ACME_EMAIL: ${ACME_EMAIL}

  # --- MONITORING LAYER ---
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.0
    container_name: node-exporter
    hostname: ascendance-production
    restart: unless-stopped
    logging: *default-logging
    profiles: ["monitoring"]

    pid: host

    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.processes"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials/.+|var/lib/docker/.+)($$|/)"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

    expose:
      - "9100"

    networks:
      - app-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    logging: *default-logging
    profiles: ["monitoring"]

    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    expose:
      - "9121"

    networks:
      - app-network

    depends_on:
      redis:
        condition: service_healthy

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    container_name: cadvisor
    restart: unless-stopped
    logging: *default-logging
    profiles: ["monitoring"]
    privileged: true

    command:
      - "--docker_only=true"
      - "--housekeeping_interval=10s"
      - "--allow_dynamic_housekeeping=false"
      - "--disable_metrics=disk"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    devices:
      - /dev/kmsg:/dev/kmsg

    expose:
      - "8080"

    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: prometheus
    restart: always
    logging: *default-logging
    profiles: ["monitoring"]

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - app-network

    depends_on:
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
      redis-exporter:
        condition: service_started

    mem_limit: 256m

  loki:
    image: grafana/loki:3.7.4
    container_name: loki
    restart: always
    logging: *default-logging
    profiles: ["monitoring"]

    command:
      - "-config.file=/etc/loki/loki-config.yml"

    ports:
      - "127.0.0.1:3100:3100"

    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

    networks:
      - app-network

    mem_limit: 358m

  loki-readiness:
    image: curlimages/curl:8.12.1
    container_name: loki-readiness
    restart: always
    logging: *default-logging
    profiles: ["monitoring"]

    entrypoint: ["/bin/sh", "-c", "while :; do sleep 3600; done"]

    networks:
      - app-network

    depends_on:
      loki:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "4",
          "http://loki:3100/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 16m

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: alloy
    restart: always
    logging: *default-logging
    profiles: ["monitoring"]

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy

    ports:
      - "127.0.0.1:12345:12345"

    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

    depends_on:
      loki-readiness:
        condition: service_healthy

    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: always
    logging: *default-logging
    profiles: ["monitoring"]

    ports:
      - "127.0.0.1:3001:3000"

    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

    networks:
      - app-network

    depends_on:
      prometheus:
        condition: service_started
      loki-readiness:
        condition: service_healthy
    mem_limit: 256m

  # Dedicated worker container
  backend-worker:
    image: ghcr.io/sunsetstack/ascendance-backend:${IMAGE_TAG:-latest}
    container_name: backend-worker
    restart: always
    logging: *default-logging

    environment:
      <<: *backend-environment
      ENABLE_API: "false"
      ENABLE_WORKERS: "true"
      SERVICE_NAME: backend-worker
      METRICS_PORT: "9464"

    expose:
      - "9464"

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:9464/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy

    networks:
      - app-network

    volumes:
      - ./backend/audit/logs:/app/audit/logs
      - ./backend/audit/archives:/app/audit/archives

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
  mongo_keyfile:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

name: Build and Deploy to production

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ascendance-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/frontend.Dockerfile
          push: true
          tags: ghcr.io/sunsetstack/ascendance-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=/
            VITE_SOCKET_URL=/

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/backend.Dockerfile
          push: true
          tags: ghcr.io/sunsetstack/ascendance-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to OVHcloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.HOST_FINGERPRINT }}
          port: 22
          envs: REDIS_PASSWORD,DEPLOY_SHA
          script: |
            set -eu

            compose() {
              if docker compose version >/dev/null 2>&1; then
                docker compose "$@"
              else
                docker-compose "$@"
              fi
            }

            cd /opt/ascendance-social

            echo "Deploying $DEPLOY_SHA as $(whoami) in $(pwd)"

            test -w .
            test -w .git
            test -s .env
            test -s certs/cert.pem
            test -s certs/key.pem

            python3 <<'PY'
            import os
            from pathlib import Path

            path = Path(".env")
            redis_password = os.environ["REDIS_PASSWORD"]

            lines = path.read_text(encoding="utf-8").splitlines()
            output = []
            replaced = False

            for line in lines:
                if line.startswith("REDIS_PASSWORD="):
                    output.append(f"REDIS_PASSWORD={redis_password}")
                    replaced = True
                else:
                    output.append(line)

            if not replaced:
                output.append(f"REDIS_PASSWORD={redis_password}")

            temporary_path = path.with_suffix(".env.tmp")
            temporary_path.write_text(
                "\n".join(output) + "\n",
                encoding="utf-8",
            )
            temporary_path.chmod(0o600)
            temporary_path.replace(path)
            PY

            git fetch --prune origin master
            git cat-file -e "$DEPLOY_SHA^{commit}"

            git sparse-checkout init --no-cone

            git sparse-checkout set --no-cone \
              /.gitignore \
              /Caddyfile \
              /docker-compose-prod.yml \
              /monitoring/ \
              /scripts/audit/

            git reset --hard "$DEPLOY_SHA"
            git sparse-checkout reapply

            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

            test -s .env
            test -s certs/cert.pem
            test -s certs/key.pem
            test -s Caddyfile
            test -s docker-compose-prod.yml
            test -s monitoring/prometheus.yml
            test -s monitoring/alloy/config.alloy
            test -s scripts/audit/seal-audit-docker.sh
            test -s scripts/audit/audit-droplet-security.sh
            test -d backend/audit/logs
            test -d backend/audit/archives

            export COMPOSE_PROFILES=monitoring
            export GIT_SHA="$DEPLOY_SHA"
            export IMAGE_TAG="$DEPLOY_SHA"

            compose -f docker-compose-prod.yml config --quiet

            compose -f docker-compose-prod.yml pull
            compose -f docker-compose-prod.yml up -d --remove-orphans
            compose -f docker-compose-prod.yml restart caddy
            compose -f docker-compose-prod.yml ps

            test "$(docker inspect backend --format '{{.Config.Image}}')" = \
              "ghcr.io/sunsetstack/ascendance-backend:$DEPLOY_SHA"

            test "$(docker inspect backend-worker --format '{{.Config.Image}}')" = \
              "ghcr.io/sunsetstack/ascendance-backend:$DEPLOY_SHA"

            test "$(docker inspect frontend --format '{{.Config.Image}}')" = \
              "ghcr.io/sunsetstack/ascendance-frontend:$DEPLOY_SHA"

            deadline=$(($(date +%s) + 240))
            until [ "$(docker inspect backend --format '{{.State.Health.Status}}')" = healthy ] && \
                  [ "$(docker inspect backend-worker --format '{{.State.Health.Status}}')" = healthy ] && \
                  docker exec frontend wget --quiet --spider --timeout=5 http://127.0.0.1/; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "Deployment failed: application readiness timed out" >&2
                compose -f docker-compose-prod.yml ps
                exit 1
              fi
              sleep 5
            done

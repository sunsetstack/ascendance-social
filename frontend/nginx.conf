
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Only accept forwarded client IP headers from trusted upstream proxies.
# Direct requests with spoofed CF-Connecting-IP keep their socket remote_addr.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

map $remote_addr $proxy_client_ip {
    default $remote_addr;
}

map $proxy_client_ip $proxy_forwarded_for {
    default $proxy_client_ip;
}

# Preserve the path received at nginx before the SPA named-location rewrite. The
# query string is deliberately excluded because it can contain credentials.
map $request_uri $ingress_request_path {
    ~^(?<ingress_request_path_without_query>[^?]*) $ingress_request_path_without_query;
}

map $http_referer $ingress_referer_path {
    "" "";
    default "";
    "~^(?<ingress_referer_without_query>https?://(?:[A-Za-z0-9.-]+|\[[0-9A-Fa-f:.]+\])(?::[0-9]{1,5})?(?:/[^?#]*)?)(?:[?#]|$)" $ingress_referer_without_query;
}

# Keep only a syntactically safe web origin. Both values are attacker-controlled
# headers, so invalid values, credentials, query strings, and fragments are not
# recorded.
map $http_origin $ingress_origin {
    default "";
    "~^(?<ingress_origin_without_credentials>https?://(?:[A-Za-z0-9.-]+|\[[0-9A-Fa-f:.]+\])(?::[0-9]{1,5})?)$" $ingress_origin_without_credentials;
}

map $request_uri $ingress_health_probe {
    default false;
    ~^/health(?:\?|$) true;
    ~^/metrics(?:\?|$) true;
}

map $uri $admin_request {
    default 0;
    ~^/api/admin(?:/|$) 1;
}

map "$admin_request:$status" $log_ingress {
    default 1;
    ~^1:[23] 0;
}

# This is an unsampled operational stream. $request_id is generated by nginx;
# $realip_remote_addr remains the direct Caddy peer after real-IP processing.
log_format ingress_access escape=json '{'
    '"event":"ingress.access",'
    '"source_layer":"nginx_origin",'
    '"timestamp_epoch_seconds":$msec,'
    '"request_id":"$request_id",'
    '"client_ip":"$proxy_client_ip",'
    '"peer_ip":"$realip_remote_addr",'
    '"client_ip_source":"nginx_realip_cf_connecting_ip",'
    '"cf_ray":"$http_cf_ray",'
    '"request_path":"$ingress_request_path",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"origin_protocol":"$server_protocol",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"duration_seconds":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"health_probe":$ingress_health_probe,'
    '"user_agent":"$http_user_agent",'
    '"accept":"$http_accept",'
    '"accept_language":"$http_accept_language",'
    '"accept_encoding":"$http_accept_encoding",'
    '"sec_ch_ua":"$http_sec_ch_ua",'
    '"sec_fetch_site":"$http_sec_fetch_site",'
    '"sec_fetch_mode":"$http_sec_fetch_mode",'
    '"sec_fetch_dest":"$http_sec_fetch_dest",'
    '"origin":"$ingress_origin",'
    '"referer":"$ingress_referer_path"'
    '}';
access_log /dev/stdout ingress_access if=$log_ingress;

upstream backend_pool {
    zone backend_pool 64k;
    least_conn;

    # Re-resolve the backend when Docker recreates it with a new container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server backend:3000 resolve max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost; 

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Allow large file uploads 
    client_max_body_size 10M;

    # Root directory for static files built by frontend
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Standard serving of static files
    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    # Keep app shell fresh while caching fingerprinted static assets
    location = /index.html {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|svg|ico|png|jpe?g|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        if ($uri ~* ^/(?:$|discover/?$|communities(?:/[^/]+(?:/members)?)?/?$|login/?$|forgot-password/?$|reset-password/?$|verify-email/?$|register/?$|profile/[^/]+(?:/follow)?/?$|results/?$|posts/[^/]+/?$|comments/[^/]+/?$|favorites/?$|messages/?$|notifications/?$|admin/?$)) {
            rewrite ^ /index.html break;
        }

        return 404;
    }

    location ^~ /api/uploads/ {
        rewrite ^/api/uploads/(.*)$ /uploads/$1 break;

        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_client_ip;
        proxy_set_header X-Forwarded-For $proxy_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $proxy_client_ip;
        proxy_set_header X-Request-ID $request_id;
    }

    # Proxy Socket.IO WebSocket connections directly to backend
    location /socket.io/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        # Critical WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Forward real client IP
        proxy_set_header X-Real-IP $proxy_client_ip;
        proxy_set_header X-Forwarded-For $proxy_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $proxy_client_ip;
        proxy_set_header X-Request-ID $request_id;

        # Timeout settings for long-lived connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Proxy API requests directly to the backend
    location /api/ {
        # No strip /api anymore
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_client_ip;
        proxy_set_header X-Forwarded-For $proxy_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $proxy_client_ip;
        proxy_set_header X-Request-ID $request_id;

        # Proper load balancer API timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /telemetry {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_client_ip;
        proxy_set_header X-Forwarded-For $proxy_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $proxy_client_ip;
        proxy_set_header X-Request-ID $request_id;
    }

    location ^~ /telemetry/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_client_ip;
        proxy_set_header X-Forwarded-For $proxy_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $proxy_client_ip;
        proxy_set_header X-Request-ID $request_id;
    }

}
